<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi Promo">
<meta name="theme-color" content="#2f4358">
<title>Suivi Promo v4.4</title>
<style>
:root{
  --encre:#1c2733;--papier:#f2f0ec;--carte:#ffffff;--trait:#d9d5cd;
  --sourdine:#6d7681;--gain:#1c6b3f;--gain-fond:#e4f0e8;
  --attente:#8a5a12;--attente-fond:#f7ecd9;--alerte:#8f2323;--alerte-fond:#f7e5e5;
  --ardoise:#2f4358;--r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-bottom:env(safe-area-inset-bottom)}
.chiffre{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{position:sticky;top:0;z-index:20;background:var(--ardoise);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.2px}
header .v{font-size:12px;opacity:.65;font-weight:400;margin-left:6px}
header .resume{margin-top:4px;font-size:13px;opacity:.88}

nav{display:flex;background:var(--carte);border-bottom:1px solid var(--trait)}
nav button{flex:1;padding:13px 2px;border:0;background:none;font-size:13.5px;
  font-weight:500;color:var(--sourdine);border-bottom:3px solid transparent;
  cursor:pointer;font-family:inherit}
nav button[aria-selected="true"]{color:var(--ardoise);border-bottom-color:var(--ardoise)}

main{padding:14px}
section[hidden]{display:none}

.ligne{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px}
.ligne.ecart{border-left:5px solid var(--gain);padding-left:11px}
.ligne.vide-releve{border-left:5px solid var(--attente);padding-left:11px}
.ligne button.zone{all:unset;display:block;width:100%;cursor:pointer}
.nom{font-size:15px;font-weight:600;margin:0}
.prec{font-size:12.5px;color:var(--sourdine);margin:2px 0 10px}
.plancher{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.plancher .p{font-size:22px;font-weight:600}
.plancher .chez{font-size:13px;color:var(--sourdine)}
.compare{margin:8px 0 0;font-size:13px;color:var(--sourdine)}
.enjeu{margin:9px 0 0;font-size:13px;font-weight:600;color:var(--gain);
  background:var(--gain-fond);display:inline-block;padding:4px 9px;border-radius:6px}
.attente-txt{margin:9px 0 0;font-size:13px;color:var(--attente);font-weight:500}

h2{font-size:13px;font-weight:600;color:var(--sourdine);margin:20px 0 8px}
h2:first-child{margin-top:0}

button.action{font-family:inherit;font-size:15px;font-weight:600;padding:13px;
  border-radius:var(--r);border:1px solid var(--ardoise);background:var(--ardoise);
  color:#fff;cursor:pointer;width:100%}
button.action.pale{background:var(--carte);color:var(--ardoise)}
button.action:disabled{opacity:.45}
.duo{display:flex;gap:9px;margin-top:12px}
.duo button{flex:1}
.solo{margin-top:10px}

label{display:block;font-size:13px;color:var(--sourdine);margin:14px 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;
  border:1px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--encre)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ardoise);outline-offset:1px}

dialog{border:0;border-radius:14px;padding:18px;width:min(94vw,420px);
  background:var(--papier);color:var(--encre)}
dialog::backdrop{background:rgba(28,39,51,.55)}
dialog h3{margin:0 0 2px;font-size:18px}
dialog .sous{margin:0;font-size:13px;color:var(--sourdine)}

.rang{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--trait);padding:9px 0;font-size:14px;gap:10px}
.rang.best span:last-child{color:var(--gain);font-weight:600}
.rang .ens{flex:1}
.rang .quand{font-size:11.5px;color:var(--sourdine);display:block}

.verdict{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px}
.verdict.oui{border-left:5px solid var(--gain);padding-left:10px}
.verdict .en{font-size:15px;font-weight:600}
.verdict .km{font-size:12.5px;color:var(--sourdine);margin:2px 0 8px}
.verdict .calc{font-size:13.5px}
.verdict .calc b{font-size:16px}
.verdict .dit{margin:8px 0 0;font-size:13.5px;font-weight:600}
.verdict.oui .dit{color:var(--gain)}
.verdict .dit.non{color:var(--sourdine)}

.vide{color:var(--sourdine);font-size:14px;padding:26px 4px;text-align:center}
.note{font-size:12.5px;color:var(--sourdine);margin-top:16px;line-height:1.5}
.bandeau{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:12px 14px;margin-bottom:14px}
.bandeau .gros{font-size:24px;font-weight:600;color:var(--gain)}
.bandeau .lab{font-size:13px;color:var(--sourdine)}

.vues{display:flex;gap:6px;margin:0 0 14px;background:var(--carte);
  border:1px solid var(--trait);border-radius:var(--r);padding:4px}
.vues button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--sourdine);cursor:pointer}
.vues button[aria-pressed="true"]{background:var(--encre);color:#fff}
.grp{border:1px solid var(--trait);border-radius:var(--r);margin-bottom:8px;
  background:var(--carte);overflow:hidden}
.grp>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;
  align-items:baseline;gap:8px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--sourdine);font-size:12px;
  transition:transform .15s}
.grp[open]>summary::before{content:"▾"}
.grp .gnom{font-size:14.5px;font-weight:700;flex:1}
.grp .gnb{font-size:12px;color:var(--sourdine)}
.grp .gprix{font-size:14px;font-weight:700;color:var(--gain)}
.grp .corps{padding:0 10px 10px}
.grp .corps .offre{margin-bottom:6px}
.etat-attente{background:var(--alerte-fond);color:var(--alerte);font-weight:600}
.offre .unitaire{font-size:13px;font-weight:600;color:var(--gain);margin-left:10px}
.aide h3{font-size:15px;font-weight:700;margin:18px 0 6px;color:var(--encre)}
.aide h4{font-size:13.5px;font-weight:700;margin:12px 0 4px;color:var(--sourdine);
  text-transform:uppercase;letter-spacing:.03em}
.aide p{font-size:14px;line-height:1.55;margin:0 0 9px}
.aide ol,.aide ul{margin:0 0 10px;padding-left:20px}
.aide li{font-size:14px;line-height:1.5;margin-bottom:4px}
.aide .cadre{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:11px 13px;margin:0 0 12px;font-size:13.5px;line-height:1.5}
.aide .cadre b{color:var(--encre)}
.alerte-bloc{background:var(--alerte-fond);border-left:5px solid var(--alerte);
  border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alerte-bloc .titre{font-size:14.5px;font-weight:700;color:var(--alerte);margin:0 0 6px}
.alerte-bloc p{margin:3px 0;font-size:13px;line-height:1.45}
.offre{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px}
.offre .t1{font-size:14.5px;font-weight:600}
.offre .t2{font-size:12.5px;color:var(--sourdine);margin:2px 0 7px}
.offre .p{font-size:18px;font-weight:600}
.offre .avant{font-size:13px;color:var(--sourdine);text-decoration:line-through;margin-left:8px}
.offre .bas{font-size:12px;color:var(--sourdine);margin-top:6px}
.offre.lie{border-left:5px solid var(--gain);padding-left:9px}
.pastille{float:right;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;
  background:var(--gain-fond);color:var(--gain)}
.etat{margin-top:10px;padding:10px 12px;border-radius:var(--r);font-size:13px;
  line-height:1.45;word-break:break-all}
.etat-ok{background:var(--gain-fond);color:var(--gain);font-weight:600}
.etat-ko{background:var(--alerte-fond);color:var(--alerte);font-weight:600}
.journal{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}
.ok{color:var(--gain);font-weight:600}
.ko{color:var(--alerte);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <h1>Suivi Promo<span class="v">v4.4</span></h1>
  <p class="resume" id="resume"></p>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-vue="liste">Comparer</button>
  <button role="tab" aria-selected="false" data-vue="panier">Trajet</button>
  <button role="tab" aria-selected="false" data-vue="reglages">Réglages</button>
  <button role="tab" aria-selected="false" data-vue="offres">Offres</button>
  <button role="tab" aria-selected="false" data-vue="make">Make</button>
  <button role="tab" aria-selected="false" data-vue="aide">Aide</button>
</nav>

<main>
  <section id="vue-liste"></section>
  <section id="vue-panier" hidden></section>
  <section id="vue-reglages" hidden></section>
  <section id="vue-offres" hidden></section>
  <section id="vue-make" hidden></section>
  <section id="vue-aide" hidden></section>
</main>

<dialog id="dlgFiche"></dialog>

<dialog id="dlgReleve">
  <h3 id="rvTitre">Noter un prix</h3>
  <p class="sous" id="rvSous"></p>
  <label for="rvEnseigne">Enseigne</label>
  <select id="rvEnseigne"></select>
  <label for="rvPrix">Prix vu (€)</label>
  <input id="rvPrix" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label for="rvDate">Date</label>
  <input id="rvDate" type="date">
  <div class="duo">
    <button class="action pale" id="rvAnnuler">Annuler</button>
    <button class="action" id="rvEnregistrer">Enregistrer</button>
  </div>
</dialog>

<dialog id="dlgProduit">
  <h3 id="pdTitre">Nouveau produit</h3>
  <p class="sous">La description exacte évite de comparer deux modèles différents.</p>
  <label for="pdNom">Nom court</label>
  <input id="pdNom" type="text" maxlength="60" placeholder="Mitigeur lavabo">
  <label for="pdPrec">Description exacte</label>
  <textarea id="pdPrec" maxlength="300" placeholder="Marque, modèle, dimensions, référence — tout ce qui distingue ce produit d'un autre"></textarea>
  <label for="pdUnites">Nombre d'unités concernées</label>
  <input id="pdUnites" type="number" inputmode="numeric" step="1" min="1" value="50">
  <p id="pdErreur" style="margin:10px 0 0;font-size:13px;color:var(--alerte);min-height:18px"></p>
  <div class="duo">
    <button class="action pale" id="pdAnnuler">Annuler</button>
    <button class="action" id="pdEnregistrer">Enregistrer</button>
  </div>
  <div class="duo"><button class="action pale" id="pdSupprimer" style="border-color:var(--alerte);color:var(--alerte)">Supprimer ce produit</button></div>
</dialog>

  }catch(e){}
  return null;
}
// Les lignes enregistrées lors des versions précédentes n'ont pas tous les
// champs ajoutés depuis. On les complète à partir des valeurs par défaut,
// sans toucher à ce que l'utilisateur a modifié, et on ajoute les lignes
// apparues entre-temps.
function completerProduits(liste){
  const enregistres = Array.isArray(liste) ? liste : [];
  enregistres.forEach(p=>{
    const d = PRODUITS_DEFAUT.find(x=>x.id === p.id);
    if(!d) return;
    // Les mots-clés, les exclusions et la famille servent au rattachement
    // des offres. Ce sont des réglages techniques, affinés à chaque version :
    // ils sont toujours repris des valeurs à jour.
    ["famille","motscles","exclure"].forEach(champ=>{ p[champ] = d[champ]; });
    // Le nom, la description et le nombre d'unités vous appartiennent :
    // ils ne sont complétés que s'ils manquent.
    ["nom","precision","unites"].forEach(champ=>{
      if(p[champ] === undefined || p[champ] === null || p[champ] === "") p[champ] = d[champ];
    });
  });
  PRODUITS_DEFAUT.forEach(d=>{
    if(!enregistres.some(p=>p.id === d.id)) enregistres.push(structuredClone(d));
  });
  return enregistres;
}

function completerEnseignes(liste){
  const enr = Array.isArray(liste) ? liste : [];
  enr.forEach(e=>{
    const d = ENSEIGNES_DEFAUT.find(x=>x.id === e.id);
    if(!d) return;
    ["nom","ville","km","pays"].forEach(c=>{ if(e[c] === undefined || e[c] === "") e[c] = d[c]; });
    if(e.folder === undefined && d.folder) e.folder = d.folder;
    if(e.cible  === undefined && d.cible)  e.cible  = d.cible;
    ["groupe","modele","regle"].forEach(c=>{ if(e[c] === undefined && d[c]) e[c] = d[c]; });
  });
  ENSEIGNES_DEFAUT.forEach(d=>{
    if(!enr.some(e=>e.id === d.id)) enr.push(structuredClone(d));
  });
  return enr;
}

function charger(){
  try{
    const brut = lireBrut();
    if(brut){
      const d = JSON.parse(brut);
      return {
        produits:  completerProduits(d.produits) || structuredClone(PRODUITS_DEFAUT),
        enseignes: completerEnseignes(d.enseignes) || structuredClone(ENSEIGNES_DEFAUT),
        releves:   d.releves   || structuredClone(RELEVES_DEFAUT),
        reglages:  Object.assign({}, REGLAGES_DEFAUT, d.reglages || {})
      };
    }
  }catch(e){}
  return {
    produits:  structuredClone(PRODUITS_DEFAUT),
    enseignes: structuredClone(ENSEIGNES_DEFAUT),
    releves:   structuredClone(RELEVES_DEFAUT),
    reglages:  structuredClone(REGLAGES_DEFAUT)
  };
}
function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){} }

const eur  = n => (n==null||isNaN(n)) ? "—" : n.toLocaleString("fr-BE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const eur0 = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("fr-BE")+" €";
const cts = n => Math.round((Number(n)||0)*100);
const enseigne = id => etat.enseignes.find(e=>e.id===id);
const produit  = id => etat.produits.find(p=>p.id===id);
const aujourdhui = () => new Date().toISOString().slice(0,10);

function jours(iso){ return iso ? Math.floor((Date.now()-new Date(iso+"T12:00:00").getTime())/86400000) : null; }
function dateFr(iso){ return iso ? new Date(iso+"T12:00:00").toLocaleDateString("fr-BE",{day:"numeric",month:"short",year:"numeric"}) : "—"; }

function dernier(pid,eid){
  const l = etat.releves.filter(r=>r.produit===pid && r.enseigne===eid).sort((a,b)=>b.date.localeCompare(a.date));
  return l[0]||null;
}
function tableau(pid){
  return etat.enseignes.map(e=>{
    const d = dernier(pid,e.id);
    return d ? {enseigne:e, prix:d.prix, date:d.date, source:d.source} : null;
  }).filter(Boolean).sort((a,b)=>a.prix-b.prix);
}
function plancher(pid){ const t=tableau(pid); return t.length?t[0]:null; }
function plafond(pid){  const t=tableau(pid); return t.length?t[t.length-1]:null; }

/* ---------- Comparer ---------- */
function rendreListe(){
  const el = document.getElementById("vue-liste");
  let enjeuTotal = 0;
  const cartes = etat.produits.map(p=>{
    const t = tableau(p.id), bas=t[0], haut=t[t.length-1];
    const compare = t.length>=2;
    const ecartCts = compare ? (cts(haut.prix)-cts(bas.prix)) : 0;
    const enjeuCts  = ecartCts * (p.unites||0);
    if(compare) enjeuTotal += enjeuCts;
    if(!t.length){
      return `<article class="ligne vide-releve"><button class="zone" data-fiche="${p.id}">
        <p class="nom">${p.nom}</p><p class="prec">${p.precision}</p>
        <p class="attente-txt">Aucun prix relevé</p></button></article>`;
    }
    const vieux = jours(bas.date) > etat.reglages.jours;
    return `<article class="ligne ${compare?"ecart":""}"><button class="zone" data-fiche="${p.id}">
      <p class="nom">${p.nom}</p><p class="prec">${p.precision}</p>
      <div class="plancher"><span class="p chiffre">${eur(bas.prix)}</span>
        <span class="chez">${bas.enseigne.nom} · ${bas.enseigne.ville}</span></div>
      ${compare
        ? `<p class="compare chiffre">le plus cher : ${eur(haut.prix)} chez ${haut.enseigne.nom} · ${t.length} enseignes</p>
           <p class="enjeu chiffre">${eur0(enjeuCts/100)} d'écart sur ${p.unites} unités</p>`
        : `<p class="compare">Une seule enseigne relevée</p>`}
      ${vieux?`<p class="attente-txt">Relevé il y a ${jours(bas.date)} jours</p>`:""}
    </button></article>`;
  }).join("");
  el.innerHTML = `<div class="bandeau"><div class="gros chiffre">${eur0(enjeuTotal/100)}</div>
    <div class="lab">Écart cumulé sur l'ensemble du parc</div></div>${cartes}
    <div class="duo"><button class="action" id="btnReleveRapide">Noter un prix</button></div>
    <div class="duo"><button class="action pale" id="btnNouveauProduit">Ajouter un produit</button></div>`;
  el.querySelectorAll("[data-fiche]").forEach(b=>{ b.onclick=()=>ouvrirFiche(b.dataset.fiche); });
  document.getElementById("btnReleveRapide").onclick=()=>{
    if(!etat.produits.length){ ouvrirProduit(null); return; }
    ouvrirReleve(etat.produits[0].id);
  };
  document.getElementById("btnNouveauProduit").onclick=()=>ouvrirProduit(null);
  majResume();
}

/* ---------- Produits ---------- */
function nouvelIdProduit(){
  let n = 1;
  const pris = new Set(etat.produits.map(p=>p.id));
  while(pris.has("p"+String(n).padStart(2,"0"))) n++;
  return "p"+String(n).padStart(2,"0");
}
function ouvrirProduit(pid){
  produitOuvert = pid;
  const p = pid ? produit(pid) : null;
  document.getElementById("pdTitre").textContent = p ? "Modifier le produit" : "Nouveau produit";
  document.getElementById("pdNom").value    = p ? p.nom : "";
  document.getElementById("pdPrec").value   = p ? p.precision : "";
  document.getElementById("pdUnites").value = p ? (p.unites||50) : (etat.produits[0] ? etat.produits[0].unites : 50);
  document.getElementById("pdErreur").textContent = "";
  document.getElementById("pdSupprimer").hidden = !p;
  document.getElementById("dlgProduit").showModal();
}
function enregistrerProduit(){
  const nom  = document.getElementById("pdNom").value.trim();
  const prec = document.getElementById("pdPrec").value.trim();
  const u    = parseInt(document.getElementById("pdUnites").value, 10);
  const err  = document.getElementById("pdErreur");
  if(nom.length < 2){ err.textContent = "Donnez un nom d'au moins deux caractères."; return false; }
  if(prec.length < 3){ err.textContent = "La description exacte est obligatoire : c'est elle qui garantit que vous comparez le même article."; return false; }
  if(!Number.isFinite(u) || u < 1){ err.textContent = "Le nombre d'unités doit être au moins 1."; return false; }
  const doublon = etat.produits.some(p=>p.id!==produitOuvert && p.nom.toLowerCase()===nom.toLowerCase());
  if(doublon){ err.textContent = "Un produit porte déjà ce nom."; return false; }
  if(produitOuvert && produit(produitOuvert)){
    const p = produit(produitOuvert);
    p.nom = nom; p.precision = prec; p.unites = u;
  } else {
    etat.produits.push({id:nouvelIdProduit(), nom, precision:prec, unites:u});
  }
  sauver();
  document.getElementById("dlgProduit").close();
  rendreTout();
  return true;
}
function supprimerProduit(){
  if(!produitOuvert) return false;
  const p = produit(produitOuvert);
  if(!p) return false;
  const n = etat.releves.filter(r=>r.produit===produitOuvert).length;
  const msg = n ? "Supprimer « "+p.nom+" » et ses "+n+" relevés ?" : "Supprimer « "+p.nom+" » ?";
  if(!confirm(msg)) return false;
  etat.produits = etat.produits.filter(x=>x.id!==produitOuvert);
  etat.releves  = etat.releves.filter(r=>r.produit!==produitOuvert);
  produitOuvert = null;
  sauver();
  document.getElementById("dlgProduit").close();
  rendreTout();
  return true;
}
document.getElementById("pdAnnuler").onclick=()=>document.getElementById("dlgProduit").close();
document.getElementById("pdEnregistrer").onclick=()=>enregistrerProduit();
document.getElementById("pdSupprimer").onclick=()=>supprimerProduit();

/* ---------- Trajet ---------- */
function rendrePanier(){
  const el = document.getElementById("vue-panier");
  const blocs = etat.enseignes.map(e=>{
    let gain=0, articles=[];
    etat.produits.forEach(p=>{
      const d=dernier(p.id,e.id), bas=plancher(p.id), haut=plafond(p.id);
      if(d && bas && haut && bas.enseigne.id===e.id && cts(haut.prix)>cts(d.prix)){
        gain += (cts(haut.prix)-cts(d.prix))/100; articles.push(p.nom);
      }
    });
    const trajet = e.km*2*etat.reglages.coutKm;
    const seuil = e.pays==="FR" ? etat.reglages.seuilFR : etat.reglages.seuilBE;
    return {e, gain, articles, trajet, net:gain-trajet, vautLeCoup: gain>=seuil && gain-trajet>0};
  }).filter(b=>b.articles.length).sort((a,b)=>b.net-a.net);

  if(!blocs.length){
    el.innerHTML = `<p class="vide">Rien à comparer pour l'instant.<br>
      Relevez le même produit chez deux enseignes.</p>`;
    return;
  }
  el.innerHTML = `<p class="note" style="margin:0 0 12px">Gain par unité en achetant ici
    plutôt qu'au prix le plus élevé relevé.</p>` + blocs.map(b=>`
    <article class="verdict ${b.vautLeCoup?"oui":""}">
      <div class="en">${b.e.nom}</div>
      <div class="km">${b.e.ville} · ${b.e.km} km aller · moins cher sur ${b.articles.length} ligne${b.articles.length>1?"s":""}</div>
      <div class="calc chiffre">Gain à l'unité <b>${eur(b.gain)}</b> — trajet ${eur(b.trajet)}</div>
      <p class="dit ${b.vautLeCoup?"":"non"}">${b.vautLeCoup?"Le déplacement se justifie dès quelques pièces":"À grouper avec d'autres achats"}</p>
    </article>`).join("");
}

// Structure complète attendue en production : tous les champs présents,

// mappables dans les modules suivants.

async function envoyer(charge, libelle){
  const url = (etat.reglages.webhook||"").trim();
  if(!url){ journal("Aucune adresse de webhook enregistrée", false); return; }
  if(!/^https?:\/\//i.test(url)){ journal("L'adresse doit commencer par https://", false); return; }
  journal("Envoi : " + libelle + "…");
  const methode = etat.reglages.methode || "POST";
  try{
    let rep;
    if(methode === "GET"){
      const params = new URLSearchParams();
      const plat = aplatir(charge);
      Object.keys(plat).forEach(k=>params.append(k, plat[k]));
      rep = await fetch(url + (url.includes("?")?"&":"?") + params.toString(), {method:"GET"});
    } else {
      rep = await fetch(url, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(charge)
      });
    }
    const texte = await rep.text();
    journal("Réponse " + rep.status + " : " + (texte.slice(0,200) || "(vide)"), rep.ok);
  }catch(err){
    journal("Échec : " + err.message + " — si le message parle de CORS, basculez en GET ci-dessus.", false);
  }
}

function aplatir(obj, prefixe){
  const sortie = {};
  Object.keys(obj).forEach(k=>{
    const cle = prefixe ? prefixe+"_"+k : k;
    const v = obj[k];
    if(v && typeof v === "object" && !Array.isArray(v)) Object.assign(sortie, aplatir(v, cle));
    else if(Array.isArray(v)) sortie[cle] = JSON.stringify(v);
    else sortie[cle] = v;
  });
  return sortie;
}

/* =========================================================
   Connexion Microsoft — repris de VeroS, mécanique éprouvée
   ========================================================= */
function jeton(){ return sessionStorage.getItem("sp_token"); }
function poserJeton(t, refresh){
  sessionStorage.setItem("sp_token", t);
  if(refresh) sessionStorage.setItem("sp_refresh", refresh);
  sessionStorage.setItem("sp_scopes", SCOPES);
}
function jetonPerime(){
  return jeton() && sessionStorage.getItem("sp_scopes") !== SCOPES;
}
function oublier(){
  ["sp_token","sp_refresh","sp_scopes","sp_verifier"].forEach(k=>sessionStorage.removeItem(k));
  location.href = REDIRECT;
}
function chaineAleatoire(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a, b => ("0"+b.toString(16)).slice(-2)).join("");
}
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function defiDepuis(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return b64url(d);
}
async function connexion(){
  const verifier = chaineAleatoire(48);
  sessionStorage.setItem("sp_verifier", verifier);
  const defi = await defiDepuis(verifier);
  location.href = AUTHORITY + "/authorize"
    + "?client_id=" + encodeURIComponent(CLIENT_ID)
    + "&response_type=code"
    + "&redirect_uri=" + encodeURIComponent(REDIRECT)
    + "&scope=" + encodeURIComponent(SCOPES)
    + "&code_challenge=" + defi
    + "&code_challenge_method=S256";
}
async function echangerCode(code){
  const verifier = sessionStorage.getItem("sp_verifier");
  if(!verifier) throw new Error("Session expirée. Reconnectez-vous.");
  const r = await fetch(AUTHORITY + "/token", {
    method:"POST", cache:"no-store",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type:"authorization_code",
      code: code, redirect_uri: REDIRECT, code_verifier: verifier
    }).toString()
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || "Connexion refusée par Microsoft.");
  poserJeton(d.access_token, d.refresh_token);
  sessionStorage.removeItem("sp_verifier");
}
async function rafraichirJeton(){
  const refresh = sessionStorage.getItem("sp_refresh");
  if(!refresh) return false;
  try{
    const r = await fetch(AUTHORITY + "/token", {
      method:"POST", cache:"no-store",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams({
        client_id: CLIENT_ID, grant_type:"refresh_token",
        refresh_token: refresh, scope: SCOPES
      }).toString()
    });
    if(!r.ok) return false;
    const d = await r.json();
    if(!d.access_token) return false;
    poserJeton(d.access_token, d.refresh_token || refresh);
    return true;
  }catch(e){ return false; }
}
async function graph(chemin, deja){
  // Microsoft redirige la lecture d'un fichier vers une adresse qui porte
  // déjà son propre jeton. Y ajouter le nôtre provoque un refus 401 sur
  // certains navigateurs : on n'envoie l'autorisation qu'à Graph lui-même.
  const url = chemin.startsWith("http") ? chemin : GRAPH + chemin;
  const propre = url.indexOf("graph.microsoft.com") !== -1;
  const r = await fetch(url, {
    cache:"no-store",
    headers: propre ? { Authorization: "Bearer " + jeton() } : {}
  });
  if(r.status === 401 && !deja){
    if(await rafraichirJeton()) return graph(chemin, true);
    throw new Error("Session expirée. Reconnectez-vous.");
  }
  if(r.status === 404) return null;
  if(!r.ok){
    const e = await r.json().catch(()=>({}));
    throw new Error((e.error && e.error.message) || ("Erreur Microsoft " + r.status));
  }
  const txt = await r.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ throw new Error("Le fichier de collectes n'est pas lisible."); }
}

/* ---------- Découverte des folders en cours ---------- */

// Chaque enseigne publie chez Publitas, mais avec sa propre logique :
// ELDI mêle français et néerlandais, Hubo noie ses folders parmi des
// brochures spéciales, Mr. Bricolage y range aussi ses catalogues jardin.
// D'où une règle de tri par enseigne.
function choisirPublication(liste, regle){
  if(!Array.isArray(liste) || !liste.length) return null;
  let candidats = liste.slice();

  if(regle === "suffixe-fr"){
    candidats = candidats.filter(p => /-fr$/i.test(p.slug || ""));
  }else if(regle === "numero-fr"){
    candidats = candidats.filter(p => /^\d{4}_fr$/i.test(p.slug || ""));
  }else if(regle === "prefixe-folder"){
    candidats = candidats.filter(p => /^folder-/i.test(p.slug || ""));
  }
  if(!candidats.length) return null;

  candidats.sort((a,b)=> String(b.onlineAt||"").localeCompare(String(a.onlineAt||"")));
  return candidats[0];
}

// silencieux : pas d'affichage, application directe des changements.
// Utilisé avant chaque collecte pour ne jamais interroger un folder périmé.
async function majFoldersAvantCollecte(){
  const cibles = etat.enseignes.filter(x => x.groupe);
  let changees = [];
  for(const e of cibles){
    try{
      const r = await fetch("https://api.publitas.com/v1/groups/" + e.groupe + "/publications.json",
                            { cache:"no-store" });
      if(!r.ok) continue;
      const p = choisirPublication(await r.json(), e.regle);
      if(!p) continue;
      const url = (e.modele || "").replace("{slug}", p.slug);
      if(url && url !== e.folder){ e.folder = url; changees.push(e.nom + " → " + p.slug); }
    }catch(err){ /* une enseigne injoignable ne doit pas bloquer la collecte */ }
  }
  if(changees.length) sauver();
  return changees;
}

async function chercherFolders(){
  const zone = document.getElementById("cfDecouverte");
  const btn  = document.getElementById("cfChercher");
  if(btn){ btn.disabled = true; btn.textContent = "Recherche en cours…"; }
  if(zone){ zone.style.display = "block"; zone.className = "etat"; zone.textContent = "Interrogation de Publitas…"; }

  const resultats = [];
  for(const e of etat.enseignes.filter(x => x.groupe)){
    try{
      const r = await fetch("https://api.publitas.com/v1/groups/" + e.groupe + "/publications.json",
                            { cache:"no-store" });
      if(!r.ok) throw new Error("réponse " + r.status);
      const liste = await r.json();
      const p = choisirPublication(liste, e.regle);
      if(!p) throw new Error("aucun folder reconnu");
      const url = (e.modele || "").replace("{slug}", p.slug);
      resultats.push({
        id: e.id, nom: e.nom, slug: p.slug, url,
        date: (p.onlineAt || "").slice(0,10),
        change: url !== e.folder
      });
    }catch(err){
      resultats.push({ id:e.id, nom:e.nom, erreur: err.message });

  if(btn){ btn.disabled = false; btn.textContent = "Vérifier les adresses des folders"; }

// Lit le contenu d'un fichier OneDrive. On demande d'abord l'adresse de
// téléchargement à Graph, puis on la suit sans en-tête d'autorisation :
// elle porte déjà son propre jeton, et en ajouter un second fait échouer
// la requête sur certains navigateurs.
async function lireFichier(id, deja){
  const r = await fetch(GRAPH + "/me/drive/items/" + id, {
    cache:"no-store",
    headers:{ Authorization: "Bearer " + jeton() }
  });
  if(r.status === 401 && !deja){
    if(await rafraichirJeton()) return lireFichier(id, true);
    throw new Error("Session expirée. Reconnectez-vous.");
  }
  if(!r.ok) throw new Error("Fichier illisible (" + r.status + ")");
  const meta = await r.json();
  const lien = meta["@microsoft.graph.downloadUrl"];
  if(!lien) throw new Error("Adresse de téléchargement absente.");
  const c = await fetch(lien, { cache:"no-store" });
  if(!c.ok) throw new Error("Téléchargement refusé (" + c.status + ")");
  const txt = await c.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error("Le fichier n'est pas un JSON lisible."); }
}
// Le nom du fichier porte la date et l'enseigne : 2026-09-11-eldi.json
// Les fichiers déposés avant septembre portaient d'autres codes.
// On les ramène au code actuel pour ne pas compter deux enseignes.
const ALIAS_ENSEIGNE = {
  "mr-bricolage":"mrbrico", "mrbricolage":"mrbrico", "mr_bricolage":"mrbrico",
  "bricoplanit":"brico", "brico-planit":"brico",
  "electro-depot":"electrodepot", "vandenborre":"vandenborre"
};

function lireNomFichier(nom){
  const m = (nom||"").match(/^(\d{4}-\d{2}-\d{2})-(.+)\.json$/i);
  if(!m) return { date:"", enseigne:"" };
  const brut = m[2].toLowerCase();
  return { date:m[1], enseigne: ALIAS_ENSEIGNE[brut] || brut };
}

async function chargerCollectes(){
  chargementOffres = "en cours";
  collectes = [];
  rendreOffres();
  try{
    const dossier = await graph(DOSSIER_COLLECTES);
    const fichiers = ((dossier && dossier.value) || [])
      .filter(f => f.file && /\.json$/i.test(f.name))
      .sort((a,b) => b.name.localeCompare(a.name));

    if(!fichiers.length){ chargementOffres = "vide"; rendreOffres(); return; }

    const lots = [];
    for(const f of fichiers){
      const info = lireNomFichier(f.name);
      try{
        const contenu = await lireFichier(f.id);
        // Make peut livrer un tableau de tableaux quand chaque page a été agrégée
        // séparément : on aplatit, et on écarte les entrées sans contenu.
        let brut = Array.isArray(contenu) ? contenu
                 : (contenu && Array.isArray(contenu.offres) ? contenu.offres : []);
        const offres = [];
        brut.forEach(x=>{
          if(Array.isArray(x)) x.forEach(y=>{ if(y && typeof y === "object") offres.push(y); });
          else if(x && typeof x === "object") offres.push(x);
        });
        lots.push({ date:info.date, enseigne:info.enseigne, fichier:f.name, offres,
                    modifie: f.lastModifiedDateTime || "" });
      }catch(e){
        lots.push({ date:info.date, enseigne:info.enseigne, fichier:f.name, offres:[],
                    modifie: f.lastModifiedDateTime || "", erreur:e.message });
      }
    }
    collectes = lots;
    chargementOffres = lots.some(l=>l.offres.length) ? "" : "vide";
  }catch(err){
    chargementOffres = "erreur: " + err.message;
    collectes = [];
  }
  rendreOffres();
}

// Rapproche une offre d'une ligne de la liste, par mots du nom du produit.
function sansAccents(t){
  return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function ligneCorrespondante(offre){
  const texte = sansAccents((offre.produit||"") + " " + (offre.modele||"") + " " + (offre.marque||""));
  let trouve = null, meilleur = 0;
  etat.produits.forEach(p=>{
    const ex = sansAccents(p.exclure).split(/\s+/).filter(Boolean);
    if(ex.some(m => texte.includes(m))) return;
    const mots = sansAccents(p.motscles || p.nom).split(/\s+/).filter(m=>m.length>3);
    const n = mots.filter(m=>texte.includes(m)).length;
    if(n > meilleur){ meilleur = n; trouve = p; }
  });
  return trouve;
}

function prixOffre(o){
  const v = Number(o.prix);
  if(!isFinite(v)) return null;
  // Les folders écrivent les prix sans séparateur : 6995 vaut 69,95 €
  return v > 1000 ? v/100 : v;
}

// Une enseigne est signalée quand ses deux dernières collectes n'ont rien
// rapporté. Une seule collecte vide n'alerte pas : un folder peut
// simplement ne contenir aucune promotion de la liste.
function enseignesMuettes(){
  const parEnseigne = {};
  collectes.forEach(c=>{
    const code = c.enseigne || "";
    if(!code) return;
    (parEnseigne[code] = parEnseigne[code] || []).push(c);
  });

  const muettes = [];
  Object.keys(parEnseigne).forEach(code=>{
    const lot = parEnseigne[code].slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(lot.length < 2) return;
    const deuxDernieres = lot.slice(0,2);
    if(deuxDernieres.some(c=>c.offres.length)) return;
    const derniereBonne = lot.find(c=>c.offres.length);
    const e = enseigne(code);
    muettes.push({
      code,
      nom: e ? e.nom : code.split("-").map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(" "),
      depuis: derniereBonne ? derniereBonne.date : "",
      vides: lot.filter(c=>!c.offres.length).length
    });
  });
  return muettes;
}

// "10 L", "2,5 L", "5L", "750 ml" -> nombre de litres
// "10 L", "2,5 L", "750 ml", et les formes promotionnelles :
// "5 L + 20% gratuits" vaut 6 L, "8 + 2 L gratuits" vaut 10 L.
function litres(contenance){
  if(!contenance) return null;
  const t = String(contenance).toLowerCase().replace(",", ".");
  // forme "8 + 2 L" : les deux nombres partagent l'unité
  const duo = t.match(/([\d.]+)\s*\+\s*([\d.]+)\s*(l|ml|litre)/);
  if(duo){
    let a = parseFloat(duo[1]), b = parseFloat(duo[2]);
    if(isFinite(a) && isFinite(b) && a > 0){
      if(duo[3] === "ml"){ a = a/1000; b = b/1000; }
      return a + b;
    }
  }
  const m = t.match(/([\d.]+)\s*(l|ml|litre)/);
  if(!m) return null;
  let v = parseFloat(m[1]);
  if(!isFinite(v) || v <= 0) return null;
  if(m[2] === "ml") v = v/1000;

  // pourcentage offert : + 20 % gratuits
  const pct = t.match(/\+\s*([\d.]+)\s*%/);
  if(pct){
    const p = parseFloat(pct[1]);
    if(isFinite(p) && p > 0 && p < 200) return v * (1 + p/100);
  }
  // volume offert : 8 + 2 L gratuits
  const plus = t.match(/\+\s*([\d.]+)\s*(l|ml|litre)/);
  if(plus){
    let b = parseFloat(plus[1]);
    if(isFinite(b) && b > 0){
      if(plus[2] === "ml") b = b/1000;
      return v + b;
    }
  }
  return v;
}

// Le prix au litre n'a de sens que pour un produit vendu au volume.
// Une contenance relevée sur un mitigeur ou une hotte ne doit rien produire.
function prixAuLitre(o){
  const ligne = ligneCorrespondante(o);
  if(!ligne || ligne.famille !== "peintures") return null;
  const p = prixOffre(o), l = litres(o.contenance);
  return (p != null && l) ? p/l : null;
}

// Compare les enseignes connues avec les fichiers du jour.
function etatCollecte(){
  const aujourdhuiIso = new Date().toISOString().slice(0,10);
  const connues = [...new Set(collectes.map(c=>c.enseigne).filter(Boolean))];
  if(!connues.length) return null;

  const duJour = collectes.filter(c=>c.date === aujourdhuiIso);
  const faites  = [...new Set(duJour.map(c=>c.enseigne))];
  const absentes = connues.filter(e=>!faites.includes(e));

  let derniere = "";
  duJour.forEach(c=>{ if(c.modifie > derniere) derniere = c.modifie; });

  return {
    total: connues.length,
    faites: faites.length,
    absentes,
    heure: derniere ? new Date(derniere).toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"}) : "",
    complete: absentes.length === 0
  };
}

function nomEnseigne(code){
  const e = enseigne(code);
  return e ? e.nom : String(code).split("-").map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(" ");
}

function rendreOffres(){
  const el = document.getElementById("vue-offres");
  if(!el) return;

  if(!jeton()){
    el.innerHTML = `
      <h2>Offres collectées</h2>
      <p class="note" style="margin:0 0 14px">Les promotions relevées par Make sont
        déposées dans votre OneDrive, dossier Suivi Promo, un fichier par collecte.
        <b>La connexion vaut pour cet appareil seulement</b> : elle est à refaire
        sur l'iPhone et sur le PC, et après la fermeture du navigateur.</p>
      <div class="duo"><button class="action" id="ofConnexion">Se connecter à OneDrive</button></div>`;
    document.getElementById("ofConnexion").onclick = connexion;
    return;
  }

  if(chargementOffres === "en cours"){
    el.innerHTML = `<p class="vide">Lecture du fichier de collectes…</p>`;
    return;
  }

  const toutes = [];
  collectes.forEach(c=>{
    (c.offres || []).forEach(o=>{
      toutes.push(Object.assign({}, o, {
        _date: c.date || "",
        _enseigne: c.enseigne || o.enseigne || ""
      }));
    });
  });

  const tete = `
    <div class="duo" style="margin-top:0;margin-bottom:14px">
      <button class="action pale" id="ofRafraichir">Rafraîchir</button>
      <button class="action pale" id="ofDeconnexion">Se déconnecter</button>
    </div>`;

  if(chargementOffres.startsWith("erreur")){
    el.innerHTML = `${tete}<div class="etat etat-ko">${chargementOffres.slice(8)}</div>`;
    brancherOffres();
    return;
  }

  if(!toutes.length){
    const m0 = enseignesMuettes();
    const a0 = m0.length ? `
      <div class="alerte-bloc">
        <p class="titre">${m0.length} enseigne${m0.length>1?"s":""} sans résultat</p>
        ${m0.map(m=>`<p><b>${m.nom}</b> — ${m.vides} collectes sans résultat. Vérifiez l'adresse du folder.</p>`).join("")}
      </div>` : "";
    el.innerHTML = `${tete}${a0}
      <p class="vide">Aucune offre dans le dossier Suivi Promo.<br>
      Il se remplira à la première collecte lancée depuis l'onglet Make.</p>`;
    brancherOffres();
    return;
  }

  // --- Vue par groupes : catégories de matériel ou enseignes ---
  const selecteur = `
    <div class="vues">
      <button type="button" data-vo="categorie" aria-pressed="${vueOffres==="categorie"}">Par catégorie</button>
      <button type="button" data-vo="enseigne" aria-pressed="${vueOffres==="enseigne"}">Par enseigne</button>
      <button type="button" data-vo="tout" aria-pressed="${vueOffres==="tout"}">Tout</button>
    </div>`;

  toutes.sort((a,b)=>{
    if(b._date !== a._date) return (b._date||"").localeCompare(a._date||"");
    return (prixOffre(a)||0) - (prixOffre(b)||0);
  });

  let liees = 0;
  const carte = o=>{
    const p = ligneCorrespondante(o);
    const prix = prixOffre(o);
    const avant = o.prix_avant ? prixOffre({prix:o.prix_avant}) : null;
    const ens = enseigne(o._enseigne);
    return `
      <article class="offre ${p?"lie":""}">
        ${p ? `<span class="pastille">${p.nom}</span>` : ""}
        <p class="t1">${o.produit || "Produit"}</p>
        <p class="t2">${[o.marque, o.modele].filter(Boolean).join(" ") || "—"}</p>
        <div><span class="p chiffre">${eur(prix)}</span>${
          avant && avant > prix ? `<span class="avant chiffre">${eur(avant)}</span>` : ""}${
          (()=>{ const pl = prixAuLitre(o);
                 return pl != null ? `<span class="unitaire chiffre">${eur(pl)} / L</span>` : ""; })()}</div>
        ${o.contenance ? `<p class="bas" style="margin-top:2px">${o.contenance}</p>` : ""}
        <p class="bas">${[ens ? ens.nom : o._enseigne,
                          o.webcode ? "webcode " + o.webcode : "",
                          o.page ? "page " + o.page : "",
                          o._date ? dateFr(o._date) : ""].filter(Boolean).join(" · ")}</p>
      </article>`;
  };

  toutes.forEach(o=>{ if(ligneCorrespondante(o)) liees++; });

  function groupe(nom, lot, sousTitre){
    if(!lot.length) return "";
    const mini = lot.reduce((m,o)=>{ const p = prixOffre(o); return (p!=null && (m==null||p<m)) ? p : m; }, null);
    return `
      <details class="grp">
        <summary>
          <span class="gnom">${nom}</span>
          <span class="gnb">${lot.length} offre${lot.length>1?"s":""}${sousTitre?" · "+sousTitre:""}</span>
          <span class="gprix chiffre">${mini!=null?eur(mini):""}</span>
        </summary>
        <div class="corps">${lot.map(carte).join("")}</div>
      </details>`;
  }

  let cartes;
  if(vueOffres === "tout"){
    cartes = toutes.map(carte).join("");
  } else if(vueOffres === "enseigne"){
    const par = {};
    toutes.forEach(o=>{ (par[o._enseigne] = par[o._enseigne] || []).push(o); });
    cartes = Object.keys(par).sort().map(code=>{
      const e = enseigne(code);
      const nom = e ? e.nom : code.split("-").map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(" ");
      return groupe(nom, par[code], e ? e.km + " km" : "");
    }).join("");
  } else {
    const par = {}; const autres = [];
    toutes.forEach(o=>{
      const p = ligneCorrespondante(o);
      if(p && p.famille) (par[p.famille] = par[p.famille] || []).push(o);
      else autres.push(o);
    });
    cartes = FAMILLES.map(f=>groupe(f.nom, par[f.id] || [])).join("")
           + groupe("Autres", autres);
  }

  const muettes = enseignesMuettes();
  const alerte = muettes.length ? `
    <div class="alerte-bloc">
      <p class="titre">${muettes.length === 1 ? "Une enseigne ne renvoie plus rien"
                                              : muettes.length + " enseignes ne renvoient plus rien"}</p>
      ${muettes.map(m=>`<p><b>${m.nom}</b> — ${m.vides} collectes sans résultat${
        m.depuis ? ", dernière réussie le " + dateFr(m.depuis) : ", jamais de résultat"
      }. Vérifiez l'adresse du folder.</p>`).join("")}
    </div>` : "";

  const ec = etatCollecte();
  if(veille && ec && ec.complete && ec.faites > 0) arreterVeille();
  const bandeauEtat = ec ? `
    <div class="etat ${veille ? "etat-attente" : (ec.complete ? "etat-ok" : "etat-attente")}">
      ${veille
        ? `Collecte en cours — ${ec.faites} enseigne${ec.faites>1?"s":""} sur ${ec.total} déposée${ec.faites>1?"s":""}. Cet écran se met à jour tout seul.`
        : ec.faites === 0
        ? "Aucune collecte aujourd'hui — la dernière remonte à plus tôt."
        : (ec.complete
            ? `Collecte du jour terminée${ec.heure ? " à " + ec.heure : ""} — ${ec.total} enseigne${ec.total>1?"s":""} sur ${ec.total}.`
            : `Collecte du jour en cours ou incomplète — ${ec.faites} sur ${ec.total}. Manque : ${ec.absentes.map(nomEnseigne).join(", ")}.`)}
    </div>` : "";

  el.innerHTML = `${tete}${alerte}${bandeauEtat}${selecteur}
    <div class="bandeau">
      <div class="gros chiffre">${toutes.length}</div>
      <div class="lab">offres collectées · ${liees} rattachées à vos lignes ·
        ${collectes.length} collecte${collectes.length>1?"s":""}${
        collectes.filter(c=>c.erreur).length ? " · " + collectes.filter(c=>c.erreur).length + " fichier(s) illisible(s)" : ""}</div>
    </div>
    ${cartes}`;
  brancherOffres();
}

// Démarre la surveillance. Appelée après un lancement de collecte.
function lancerVeille(){
  arreterVeille();
  veilleDepuis = Date.now();
  veille = setInterval(async ()=>{
    if(Date.now() - veilleDepuis > 30*60*1000){ arreterVeille(); rendreOffres(); return; }
    if(!jeton()){ arreterVeille(); return; }
    await chargerCollectes();
    const ec = etatCollecte();
    if(ec && ec.complete && ec.faites > 0) arreterVeille();
  }, 30000);
  rendreOffres();
}

function arreterVeille(){
  if(veille){ clearInterval(veille); veille = null; }
}

function brancherOffres(){
  // Les boutons de vue sont recréés à chaque affichage. Plutôt que de les
  // recâbler un par un, on écoute une seule fois le conteneur, qui lui est
  // permanent : le clic remonte jusqu'à lui (délégation d'événement).
  const zone = document.getElementById("vue-offres");
  if(zone && !zone.dataset.deleguee){
    zone.dataset.deleguee = "1";
    zone.addEventListener("click", ev=>{
      const b = ev.target && ev.target.closest ? ev.target.closest("[data-vo]") : null;
      if(!b) return;
      ev.preventDefault();
      vueOffres = b.getAttribute("data-vo");
      rendreOffres();
    });
  }
  const r = document.getElementById("ofRafraichir");
  if(r) r.onclick = chargerCollectes;
  const d = document.getElementById("ofDeconnexion");
  if(d) d.onclick = oublier;
}

/* ---------- Navigation ---------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    vue = b.dataset.vue;
    document.querySelectorAll("nav button").forEach(x=>
      x.setAttribute("aria-selected", x===b?"true":"false"));
    rendreTout();
  };
});
function rendreTout(){
  document.getElementById("vue-liste").hidden    = vue!=="liste";
  document.getElementById("vue-panier").hidden   = vue!=="panier";
  document.getElementById("vue-reglages").hidden = vue!=="reglages";
  document.getElementById("vue-offres").hidden   = vue!=="offres";
  document.getElementById("vue-make").hidden     = vue!=="make";
  document.getElementById("vue-aide").hidden     = vue!=="aide";
  if(vue==="liste")    rendreListe();
  if(vue==="panier"){  rendrePanier(); majResume(); }
  if(vue==="reglages"){rendreReglages(); majResume(); }
  if(vue==="offres"){  rendreOffres(); majResume(); }
  if(vue==="make"){    rendreMake(); majResume(); }
  if(vue==="aide"){    rendreAide(); majResume(); }
}
/* ---------- Démarrage ---------- */
(async function demarrer(){
  const params = new URLSearchParams(location.search);

  if(params.get("error")){
    rendreTout();
    vue = "offres";
    document.getElementById("vue-offres").innerHTML =
      '<div class="etat etat-ko">' +
      (params.get("error_description") || params.get("error")) + '</div>';
    return;
  }

  if(params.get("code")){
    try{
      await echangerCode(params.get("code"));
      history.replaceState({}, "", REDIRECT);
      vue = "offres";
      document.querySelectorAll("nav button").forEach(x=>
        x.setAttribute("aria-selected", x.dataset.vue==="offres" ? "true":"false"));
      rendreTout();
      chargerCollectes();
    }catch(err){
      rendreTout();
      vue = "offres";
      document.getElementById("vue-offres").innerHTML =
        '<div class="etat etat-ko">' + err.message + '</div>';
    }
    return;
  }

  if(jetonPerime()){
    ["sp_token","sp_scopes"].forEach(k=>sessionStorage.removeItem(k));
  }

  rendreTout();
  if(jeton()) chargerCollectes();
})();
</script>
